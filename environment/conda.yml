# Recommended clean Linux/NVIDIA environment, not the historical server lock.
name: mambahsi
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.9
  - pip
  - pytorch=1.13.1
  - torchvision=0.14.1
  - torchaudio=0.13.1
  - pytorch-cuda=11.7
  # The exact NumPy pin is installed from requirements.txt in the next step.
  # Keep the Conda solve independent of this pip-installed patch release.
  - numpy<2
